spring:
  application:
    name: alphagraph
  profiles:
    default: local
  flyway:
    enabled: false # migrations run per-module via FlywayMultiSchemaConfig instead
  task:
    scheduling:
      pool:
        # Spring Boot's own default is 1 - every one of this app's 47 @Scheduled cron jobs shared
        # a single thread, so a long-running one (knowledge-extraction, sequential real LLM calls
        # over the day's document backlog) blocked every other job's own scheduled time for its
        # entire duration - confirmed live via a thread dump showing exactly one "scheduling-1"
        # thread, mid-Gemini-call, while discovery-convergence-detection/lifecycle-classification
        # sat missed behind it. 10 gives real headroom over the busiest same-minute cluster
        # (18:30 alone schedules 2 jobs) without over-provisioning for a single-instance app.
        size: 10

management:
  endpoints:
    web:
      exposure:
        include: health

alphagraph:
  data-quality:
    floor: 0.7 # batches scoring below this are quarantined - never reach Calculate/Score
  security:
    # Dev-only default so this works out of the box locally. Override with a real secret via
    # JWT_SECRET in docker/prod - see docs/005_Deployment.md §6 on rotation.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-do-not-use-in-production-32bytes}
    jwt-expiry-minutes: 60
  market:
    # Only used by HttpBhavdataCollector (docker/prod profiles). A URL path change on NSE's
    # side is a config update here, not a redeploy - a format change still needs code changes.
    nse-bhavdata-url-template: https://archives.nseindia.com/products/content/sec_bhavdata_full_%s.csv
  nlp-sidecar:
    # Module 2.1: the Python NLP sidecar (nlp-sidecar/). localhost:8000 for local dev (run
    # uvicorn directly); docker-compose's service name resolves this in docker/prod profiles.
    base-url: ${NLP_SIDECAR_URL:http://localhost:8000}
  corporate:
    news-extractor:
      # NewsExtractor's Gemini free-tier pilot (real cost driver: knowledge-extraction is the
      # dominant Claude spend in this app). true = try Gemini first; Claude only as a capped last
      # resort (see claude-fallback below). false = Claude for every article, uncapped - the way to
      # go back to Claude-only with no code change, and the expensive one.
      use-gemini: true
    gemini:
      # Every Gemini call (Stage 1 + news extraction share one project quota) goes through
      # GeminiCallExecutor: paced, retried, and circuit-broken. Gemini's free tier allows 5 requests
      # a minute and a news sweep makes two calls per article - exceeding that sent a large share of
      # news to Claude, which is what made the Claude bill jump ~10x after the news rework.
      requests-per-minute: 4 # stay under the free tier's 5; raise it (or 0 = no pacing) once on a paid tier
      max-attempts: 4 # per call, including the first
      max-retry-wait-seconds: 90 # a 429 asking for longer than this (a daily quota) isn't waited for
      breaker-failures: 3 # consecutive calls that exhausted their retries before Gemini calls pause
      breaker-open-minutes: 10
    claude-fallback:
      # Claude is a last resort for NEWS only, and capped: at most this many fallback calls per day
      # for each of Stage 1 and news extraction, counted in corporate.claude_fallback_usage so a
      # restart can't reset it. 0 disables the fallback entirely. When Gemini is merely unavailable
      # (quota/overload) Claude is never used regardless - the document waits for the next sweep.
      daily-limit-per-purpose: 10
    stage1-classification:
      # Stage 1 (DocumentIntelligenceEngine) is mandatory for every document, regardless of which
      # Stage 2 extractor eventually runs - this is a separate toggle from news-extractor.use-gemini
      # above, scoped ONLY to NEWS-sourced documents (see DocumentIntelligenceEngine.classify).
      # Every other source (EXCHANGE_ANNOUNCEMENT, QUARTERLY_RESULTS, ...) stays Claude-only
      # unconditionally regardless of this flag - a Stage 1 misclassification silently misroutes a
      # document, so this pilot deliberately does not extend beyond public news content.
      use-gemini-for-news: true
      # Stage 1 only decides what a document is and which extractors it needs, so a long document is
      # sent as just its beginning and end (80%/20% of this many characters, with a marker for the
      # omitted middle); Stage 2 extractors still get the full text. Measured on 24 real long
      # announcements: input to Claude -33%, the financial-results extractor still chosen 11/11,
      # but the management-guidance extractor was chosen for 16 of the 20 extractor uses the full
      # text had (Stage 1's pick of it is noisy even on full text). 10000 saved more (-39%) and
      # kept fewer (14/20). 0 = send everything (the old behaviour).
      max-chars: 30000
    announcement-text-budget:
      # Ceiling on exchange-announcement text sent for extraction per India calendar day (counted
      # once per document; ~$2.6 per million characters at October's mix). Past it, the rest wait
      # for the next sweep, oldest first - nothing is dropped. The first document of a day always
      # runs. A results-season Saturday brought 3.3M characters (~$9); 0 = no cap.
      daily-chars: 1500000
