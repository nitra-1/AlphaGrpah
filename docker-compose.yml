services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alphagraph
      POSTGRES_USER: alphagraph_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alphagraph_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphagraph_app -d alphagraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
